kind = "web"
previewPath = "/"
title = "BELIEVE JAH Design"
description = "A luxury editorial portfolio for BELIEVE JAH Design, showcasing Nigerian bespoke menswear and routing custom-fit consultations directly to WhatsApp."
version = "1.0.0"
id = "artifacts/believe-jah"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18288

[services.development]
run = "pnpm --filter @workspace/believe-jah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/believe-jah", "run", "build" ]
serve = "static"
publicDir = "artifacts/believe-jah/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18288"
BASE_PATH = "/"
